name: Build & Deploy Static Site

on:
  # 每12小时自动构建（北京时间 0:00 和 12:00）
  schedule:
    - cron: '0 16 * * *'   # UTC 16:00 = 北京 00:00
    - cron: '0 4 * * *'    # UTC 04:00 = 北京 12:00
  # 手动触发
  workflow_dispatch:
  # push 到 main 分支时也构建
  push:
    branches: [ main ]

permissions:
  contents: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch data & Generate site
        env:
          SITE_URL: https://hltx.eu.cc
        run: |
          chmod +x build.sh
          ./build.sh
          echo "--- dist contents ---"
          ls -la dist/
          ls -la dist/products/

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ dist/ -f
          git diff --cached --quiet || git commit -m "🔄 Auto rebuild $(date '+%Y-%m-%d %H:%M')"
          git push

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          enable_jekyll: false
